[tool.poetry]
name = "MPT"
version = "1.2.0"
description = "Reads ImageJ results file, in CSV. Exports Multiple Particle Tracking Analysis in xlsx format."
authors = ["Leandro Gabriel <git@lagabriel.com>"]
license = "GPL-3.0-only"
readme = "README.md"
repository = "https://github.com/lassisg/mpthub"

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
numpy = ">=1.26.4,<2"    # guard: lift with the pandas 3 / numpy 2 cycle
pandas = ">=2.3.3,<3"
PySide6 = ">=6.12,<7"
SQLAlchemy = ">=2.1.6,<3"
trackpy = ">=0.7"
XlsxWriter = ">=3.3"

[tool.poetry.group.dev.dependencies]
autopep8 = ">=2.3"
flake8 = ">=7.4"
pyinstaller = ">=6.22"
pytest = ">=9.1"

[tool.poetry.scripts]
build_mpt = "build_mpt:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"